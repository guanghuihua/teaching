<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>湘教版数学必修第一册教材题库</title>
<style>
:root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#1f2933;background:#f4f5f7;font-size:15px;line-height:1.65}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #ddd;padding:28px max(24px,calc((100vw - 1180px)/2)) 22px}h1{font-size:26px;line-height:1.4;margin:0 0 10px;color:#172b4d}header p{margin:5px 0;color:#52606d}.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;font-size:14px}.stats strong{font-size:23px;color:#172b4d;margin-right:5px}.layout{max-width:1180px;margin:22px auto;display:grid;grid-template-columns:245px 1fr;gap:22px;padding:0 18px}.filters{background:white;border:1px solid #ddd;padding:18px;height:fit-content;position:sticky;top:15px;border-radius:6px}label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px}label:first-child{margin-top:0}input[type=search],input[type=number],select{width:100%;padding:9px;border:1px solid #b8c1cb;border-radius:4px;background:white;font:inherit;font-size:14px}input:focus,select:focus,button:focus{outline:2px solid #6590c8;outline-offset:2px}.check{font-weight:400;display:flex;align-items:center;gap:7px}.check input{accent-color:#244f86}button{font:inherit;line-height:1.5;font-size:13px;padding:7px 11px;border:1px solid #aab5c0;background:#fff;border-radius:4px;color:#243b53;cursor:pointer}button:hover{background:#edf2f7}.primary{background:#244f86;color:white;border-color:#244f86}.primary:hover{background:#183f70}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.actions button{flex:1;white-space:nowrap}.hint{font-size:12px;color:#687785;line-height:1.7;margin-top:14px}.resultsbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.resultcount{font-size:15px;font-weight:600}.pager{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:13px}.card{background:white;border:1px solid #d7dde3;border-radius:6px;margin-bottom:18px;overflow:hidden}.cardtop{padding:15px 18px 12px;border-bottom:1px solid #e7eaee}.card h2{font-size:18px;margin:0;display:flex;align-items:center;gap:9px}.card h2 input{width:17px;height:17px;accent-color:#244f86;flex-shrink:0}.kind{display:inline-block;background:#edf2f7;color:#334e68;padding:1px 7px;border-radius:3px;font-size:12px;margin-right:6px}.meta{margin-top:7px;font-size:13px;color:#52606d}.id{font-family:Consolas,monospace;font-size:11px;color:#7b8794;margin-top:4px;overflow-wrap:anywhere}.images{padding:12px 14px}.part{margin:0 0 8px}.part img{display:block;width:100%;height:auto;min-height:20px}.part figcaption{font-size:11px;color:#7b8794;margin-bottom:3px}.cardfoot{padding:0 18px 16px;font-size:12px;color:#687785}details{margin-top:8px}summary{cursor:pointer;color:#244f86}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;line-height:1.8;background:#f8f9fb;padding:12px;border:1px solid #e3e7ed;font-size:12px;color:#536170}.context img{width:100%;height:auto;margin:10px 0}.empty{padding:50px;background:#fff;text-align:center;border:1px solid #ddd;color:#52606d}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#243b53;color:#fff;padding:10px 18px;border-radius:6px;z-index:4;font-size:13px}.bottompager{justify-content:center;padding:20px}.printtitle{display:none}a{color:#244f86}.topnote{font-size:13px}.scope{color:#2b6151}.noscript{padding:30px;background:#fff8dc}
@media(max-width:800px){header{padding:20px}h1{font-size:22px}.layout{display:block;margin-top:15px;padding:0 12px}.filters{position:static;margin-bottom:18px;display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.filters .wide{grid-column:1/-1}.resultsbar{align-items:flex-start;flex-direction:column}.stats{gap:12px}.cardtop{padding:13px}.images{padding:8px}.cardfoot{padding:0 13px 13px}}
@media print{@page{size:A4;margin:16mm}body{background:white;font-size:11pt}header,.filters,.resultsbar,.pager,.cardfoot,footer,.toast{display:none!important}.layout{display:block;padding:0;margin:0;max-width:none}.printtitle{display:block;margin-bottom:15px}.card{border:0;border-radius:0;margin:0 0 18mm;break-inside:auto}.cardtop{padding:0 0 7px;border-bottom:1px solid #aaa}.card h2{font-size:12pt}.card h2 input,.id{display:none}.meta{font-size:9pt}.images{padding:6px 0}.part{break-inside:avoid}.part img{max-height:235mm;object-fit:contain;object-position:top left;width:auto;max-width:100%}.part figcaption{font-size:8pt}.kind{background:transparent;padding:0;font-size:9pt}}
</style>
</head>
<body>
<header>
<h1>湘教版数学必修第一册教材题库</h1>
<p>按教材原题整理，题目原图与教材位置一一对应。</p>
<p class="topnote">小问随大题保留；例题包含教材原解与紧邻说明。OCR 文字仅用于检索，尚未逐字校对。</p>
<div class="stats" id="stats"></div>
</header>
<noscript><div class="noscript">此检索页需要启用 JavaScript。也可直接打开同目录“分章题库”中的 Markdown 文档查看全部题目。</div></noscript>
<div class="layout">
<aside class="filters" aria-label="题库筛选">
<div class="wide"><label for="search">关键词或题库编号</label><input id="search" type="search" placeholder="如：交集、单调性、XJ-B1…"></div>
<div><label for="chapter">章节</label><select id="chapter"><option value="">全部章节</option></select></div>
<div><label for="section">小节</label><select id="section"><option value="">全部小节</option></select></div>
<div><label for="type">题目类型</label><select id="type"><option value="">全部类型</option></select></div>
<div><label for="printed">教材印刷页码</label><input id="printed" type="number" min="1" max="269" placeholder="例如 77"></div>
<div class="wide"><label class="check"><input id="midterm" type="checkbox">只看期中范围（至指数函数）</label><label class="check"><input id="selectedOnly" type="checkbox">只看已选题目（<span id="selectionCount">0</span>）</label></div>
<div class="wide actions"><button id="reset">清除筛选</button><button id="clearSelection">清空已选</button></div>
<div class="wide actions"><button id="export">导出所选清单</button><button class="primary" id="print">打印所选原图</button></div>
<div class="wide hint">页码框填写教材页脚的印刷页码；PDF 文件页序比印刷页码多 7。每题可展开原页，核对题前配图、共用表格和跨题引用。导出清单含来源与图像路径，可用于后续整理组卷。</div>
</aside>
<main>
<div class="printtitle"><h1>教材原题选题清单</h1><p>湘教版高中数学必修第一册 · 原题图像与出处</p></div>
<div class="resultsbar"><span class="resultcount" id="resultCount"></span><div class="pager"><button data-page="prev">上一页</button><span id="pageStatus"></span><button data-page="next">下一页</button></div></div>
<div id="cards"></div>
<div class="pager bottompager"><button data-page="prev">上一页</button><span id="bottomPageStatus"></span><button data-page="next">下一页</button></div>
</main>
</div>
<script src="题库数据.js"></script>
<script>
"use strict";
const bank=window.TEXTBOOK_BANK, items=bank.items, $=id=>document.getElementById(id), size=20;
const key="xiangjiao-b1-bank-selection-"+bank.source_sha256.slice(0,12);
let selected=new Set(),page=1,current=[],directId=decodeURIComponent(location.hash.slice(1)),printing=false;
try{selected=new Set(JSON.parse(localStorage.getItem(key)||"[]").filter(id=>items.some(r=>r.id===id)));}catch(e){}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const option=(value,text)=>{const o=document.createElement("option");o.value=value;o.textContent=text;return o;};
for(const c of [...new Set(items.map(r=>r.chapter))]) $("chapter").append(option(c,`第${c}章 ${items.find(r=>r.chapter===c).chapter_title}`));
for(const t of ["例题","练习","习题","复习题","思考","小结与复习","案例","数学实验"]) $("type").append(option(t,`${t}（${bank.statistics.by_type[t]}）`));
$("stats").innerHTML=`<span><strong>${items.length}</strong>个条目</span><span><strong>6</strong>章</span><span><strong>${bank.statistics.midterm}</strong>个期中范围条目</span><span><strong>${bank.statistics.cross_page_records}</strong>个跨页条目</span>`;
function sections(){const before=$("section").value;$("section").replaceChildren(option("","全部小节"));const rows=items.filter(r=>!$("chapter").value||r.chapter===Number($("chapter").value));const seen=new Set();for(const r of rows){const val=r.chapter+"/"+r.section;if(seen.has(val))continue;seen.add(val);$("section").append(option(val,r.section+" "+r.section_title));}if([...$("section").options].some(o=>o.value===before))$("section").value=before;}
function saveSelection(){try{localStorage.setItem(key,JSON.stringify([...selected]));}catch(e){}$("selectionCount").textContent=selected.size;}
function notify(text){document.querySelectorAll(".toast").forEach(n=>n.remove());const n=document.createElement("div");n.className="toast";n.textContent=text;document.body.append(n);setTimeout(()=>n.remove(),3500);}
function card(r){const node=document.createElement("article");node.className="card";node.id=r.id;const ps=r.printed_pages.join("、"),pdf=r.pdf_pages.join("、");node.innerHTML=`<div class="cardtop"><h2><input type="checkbox" aria-label="选择 ${esc(r.id)}" ${selected.has(r.id)?"checked":""}><span>${esc(r.title)}</span></h2><div class="meta"><span class="kind">${esc(r.type)}</span>第${r.chapter}章 · ${esc(r.section)} ${esc(r.section_title)}<br><strong>教材 p.${ps}</strong> · PDF 第${pdf}页 ${r.midterm_scope?'<span class="scope">· 期中范围</span>':""}</div><div class="id">${esc(r.id)}</div></div><div class="images">${r.parts.map(p=>`<figure class="part"><figcaption>教材 p.${p.printed_page} · PDF 第${p.pdf_page}页</figcaption><img loading="${printing?"eager":"lazy"}" src="${encodeURI(p.image)}" alt="${esc(r.title)} 教材p.${p.printed_page}原图"></figure>`).join("")}</div><div class="cardfoot">${esc(r.context_note)}<details class="source"><summary>查看完整原页上下文</summary><div class="context"></div></details><details><summary>OCR 检索草稿（未校对）</summary><pre>${esc(r.ocr_draft)}</pre></details></div>`;
node.querySelector("input").addEventListener("change",e=>{if(e.target.checked)selected.add(r.id);else selected.delete(r.id);saveSelection();if($("selectedOnly").checked)filter();});
const detail=node.querySelector(".source");detail.addEventListener("toggle",()=>{if(detail.open&&!detail.dataset.loaded){detail.dataset.loaded="1";const ctx=detail.querySelector(".context");r.context_images.forEach((im,i)=>{const a=document.createElement("a");a.href=encodeURI(im);a.target="_blank";a.rel="noopener";const img=document.createElement("img");img.src=encodeURI(im);img.alt=`完整教材原页 p.${r.printed_pages[i]}`;img.loading="lazy";a.append(img);ctx.append(a);});}});return node;}
function render(rows=null){const total=Math.max(1,Math.ceil(current.length/size));page=Math.min(Math.max(1,page),total);const shown=rows||current.slice((page-1)*size,page*size);$("cards").replaceChildren();if(!shown.length){const n=document.createElement("div");n.className="empty";n.textContent="没有符合条件的条目。可缩短关键词，或清除章节、页码等筛选条件。";$("cards").append(n);}else shown.forEach(r=>$("cards").append(card(r)));$("resultCount").textContent=directId?"按编号定位到 1 个条目":`找到 ${current.length} 个条目`;$("pageStatus").textContent=$("bottomPageStatus").textContent=`${page} / ${total}`;document.querySelectorAll('[data-page="prev"]').forEach(b=>b.disabled=page===1);document.querySelectorAll('[data-page="next"]').forEach(b=>b.disabled=page===total);saveSelection();}
function filter(){const words=$("search").value.trim().toLowerCase().split(/\s+/).filter(Boolean);const chapter=Number($("chapter").value),sec=$("section").value,type=$("type").value,printed=Number($("printed").value);current=items.filter(r=>(!directId||r.id===directId)&&(!chapter||r.chapter===chapter)&&(!sec||r.chapter+"/"+r.section===sec)&&(!type||r.type===type)&&(!printed||r.printed_pages.includes(printed))&&(!$("midterm").checked||r.midterm_scope)&&(!$("selectedOnly").checked||selected.has(r.id))&&words.every(w=>(r.id+" "+r.title+" "+r.chapter_title+" "+r.section_title+" "+r.ocr_draft).toLowerCase().includes(w)));page=1;render();}
for(const id of ["search","printed"])$(id).addEventListener("input",()=>{directId="";filter();});
for(const id of ["section","type","midterm","selectedOnly"])$(id).addEventListener("change",()=>{directId="";filter();});
$("chapter").addEventListener("change",()=>{directId="";sections();filter();});
$("reset").addEventListener("click",()=>{for(const id of ["search","printed","chapter","section","type"])$(id).value="";$("midterm").checked=false;$("selectedOnly").checked=false;directId="";history.replaceState(null,"",location.pathname);sections();filter();});
$("clearSelection").addEventListener("click",()=>{selected.clear();saveSelection();filter();});
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>{page+=b.dataset.page==="next"?1:-1;render();window.scrollTo({top:0,behavior:"smooth"});}));
$("export").addEventListener("click",()=>{if(!selected.size)return notify("请先勾选题目。");const chosen=items.filter(r=>selected.has(r.id));const blob=new Blob([JSON.stringify({book:bank.book,source_sha256:bank.source_sha256,policy:bank.policy,items:chosen},null,2)],{type:"application/json;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="湘教版必修一_选题清单.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);});
$("print").addEventListener("click",async()=>{if(!selected.size)return notify("请先勾选要打印的题目。例题原图含教材原解。");printing=true;render(items.filter(r=>selected.has(r.id)));await Promise.all([...$("cards").querySelectorAll(".part img")].map(im=>im.decode().catch(()=>{})));window.print();printing=false;render();});
window.addEventListener("hashchange",()=>{directId=decodeURIComponent(location.hash.slice(1));filter();});
sections();filter();
</script>
</body>
</html>
