<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <style>
      @font-face {
        font-family: "Diagram Chinese";
        src: url("file:///mnt/c/Windows/Fonts/msyh.ttc") format("truetype");
      }
      @font-face {
        font-family: "Diagram Chinese";
        src: url("file:///mnt/c/Windows/Fonts/msyhbd.ttc") format("truetype");
        font-weight: 700;
      }
      .title { font: 700 30px "Diagram Chinese", "Microsoft YaHei", sans-serif; fill: #17212b; }
      .panel-title { font: 700 20px "Diagram Chinese", "Microsoft YaHei", sans-serif; fill: #17212b; }
      .body { font: 16px "Diagram Chinese", "Microsoft YaHei", sans-serif; fill: #33404d; }
      .small { font: 14px "Diagram Chinese", "Microsoft YaHei", sans-serif; fill: #53606c; }
      .math { font: italic 17px "Times New Roman", serif; fill: #17212b; }
      .axis { stroke: #66727e; stroke-width: 1.5; }
      .grid { stroke: #dfe4e8; stroke-width: 1; }
      .curve { fill: none; stroke: #137c8b; stroke-width: 3; }
      .diagonal { fill: none; stroke: #b04a3a; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .cobweb { fill: none; stroke: #d08a24; stroke-width: 2.5; }
      .guide { stroke: #9aa5ae; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .point { fill: #d08a24; stroke: white; stroke-width: 2; }
      .fixed { fill: #b04a3a; stroke: white; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #cfd6dc; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #66727e; stroke-width: 2; marker-end: url(#arrowhead); }
      .step { stroke: #137c8b; stroke-width: 3; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#66727e"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#f6f8fa"/>
  <text x="600" y="48" text-anchor="middle" class="title">为什么把坐标原点从 0 移到不动点 2？</text>
  <text x="600" y="78" text-anchor="middle" class="body">同一个递推过程，用三把不同的“尺子”观察</text>

  <!-- Left: iteration graph -->
  <rect x="40" y="105" width="540" height="400" rx="6" class="box"/>
  <text x="65" y="138" class="panel-title">1. 递推机器有一个不动的中心</text>
  <text x="65" y="166" class="math">f(x) = (6x - 4)/(x + 2)</text>

  <!-- graph area x: 1.8..3.2, y: 1.8..3.2 -->
  <line x1="100" y1="455" x2="525" y2="455" class="axis"/>
  <line x1="100" y1="455" x2="100" y2="195" class="axis"/>
  <line x1="161" y1="455" x2="161" y2="195" class="grid"/>
  <line x1="222" y1="455" x2="222" y2="195" class="grid"/>
  <line x1="282" y1="455" x2="282" y2="195" class="grid"/>
  <line x1="343" y1="455" x2="343" y2="195" class="grid"/>
  <line x1="404" y1="455" x2="404" y2="195" class="grid"/>
  <line x1="465" y1="455" x2="465" y2="195" class="grid"/>
  <line x1="100" y1="418" x2="525" y2="418" class="grid"/>
  <line x1="100" y1="381" x2="525" y2="381" class="grid"/>
  <line x1="100" y1="344" x2="525" y2="344" class="grid"/>
  <line x1="100" y1="307" x2="525" y2="307" class="grid"/>
  <line x1="100" y1="270" x2="525" y2="270" class="grid"/>
  <line x1="100" y1="233" x2="525" y2="233" class="grid"/>

  <path d="M100 455 L525 195" class="diagonal"/>
  <polyline points="100,457 130,438 161,418 191,399 222,381 252,364 282,347 313,331 343,315 374,300 404,285 434,271 465,257 495,244 525,231" class="curve"/>

  <!-- cobweb a1=3 -> a2=2.8 -> a3=8/3 -> a4=18/7 -->
  <polyline points="465,455 465,270 404,270 404,295 363,295 363,319 334,319 334,336 313,336" class="cobweb"/>
  <circle cx="161" cy="418" r="7" class="fixed"/>
  <text x="171" y="410" class="body">不动点 (2, 2)</text>
  <text x="438" y="288" class="small">a₁=3</text>
  <text x="410" y="260" class="small">a₂=2.8</text>
  <text x="485" y="220" class="small" fill="#137c8b">y=f(x)</text>
  <text x="455" y="206" class="small" fill="#b04a3a">y=x</text>
  <text x="115" y="482" class="small">1.8</text>
  <text x="151" y="482" class="small">2</text>
  <text x="454" y="482" class="small">3</text>
  <text x="517" y="482" class="small">x</text>
  <text x="80" y="205" class="small">y</text>

  <!-- Right: number lines -->
  <rect x="600" y="105" width="560" height="400" rx="6" class="box"/>
  <text x="625" y="138" class="panel-title">2. 同一串数，在不同坐标中呈现不同规律</text>

  <text x="625" y="183" class="body">原坐标：直接记录 aₙ（原点 O=0）</text>
  <line x1="650" y1="220" x2="1110" y2="220" class="axis"/>
  <line x1="650" y1="211" x2="650" y2="229" class="axis"/>
  <line x1="938" y1="211" x2="938" y2="229" class="axis"/>
  <text x="646" y="248" class="small">0</text>
  <text x="931" y="248" class="small">2</text>
  <text x="905" y="274" class="small" fill="#b04a3a">特殊点 2 离原点很远</text>
  <circle cx="1082" cy="220" r="7" class="point"/>
  <circle cx="1053" cy="220" r="7" fill="#e2a750" stroke="white" stroke-width="2"/>
  <circle cx="1034" cy="220" r="7" fill="#e9bd76" stroke="white" stroke-width="2"/>
  <circle cx="1020" cy="220" r="7" fill="#efcf9b" stroke="white" stroke-width="2"/>
  <text x="1072" y="201" class="small">a₁</text>
  <text x="1043" y="201" class="small">a₂</text>
  <text x="1024" y="201" class="small">a₃</text>
  <text x="1010" y="201" class="small">a₄</text>

  <text x="625" y="312" class="body">平移坐标：uₙ=aₙ−2（把新原点 O′ 放在旧坐标的 2）</text>
  <line x1="650" y1="348" x2="1110" y2="348" class="axis"/>
  <line x1="650" y1="339" x2="650" y2="357" class="axis"/>
  <text x="646" y="376" class="small">0</text>
  <text x="672" y="399" class="small" fill="#b04a3a">现在“2”就是原点，点的位置直接表示离 2 多远</text>
  <circle cx="1082" cy="348" r="7" class="point"/>
  <circle cx="996" cy="348" r="7" fill="#e2a750" stroke="white" stroke-width="2"/>
  <circle cx="938" cy="348" r="7" fill="#e9bd76" stroke="white" stroke-width="2"/>
  <circle cx="913" cy="348" r="7" fill="#efcf9b" stroke="white" stroke-width="2"/>
  <text x="1073" y="333" class="small">1</text>
  <text x="982" y="333" class="small">4/5</text>
  <text x="924" y="333" class="small">2/3</text>
  <text x="899" y="333" class="small">4/7</text>

  <text x="625" y="435" class="body">倒数坐标：bₙ=1/uₙ=1/(aₙ−2)</text>
  <line x1="700" y1="470" x2="1090" y2="470" class="axis"/>
  <circle cx="730" cy="470" r="7" class="point"/>
  <circle cx="830" cy="470" r="7" fill="#e2a750" stroke="white" stroke-width="2"/>
  <circle cx="930" cy="470" r="7" fill="#e9bd76" stroke="white" stroke-width="2"/>
  <circle cx="1030" cy="470" r="7" fill="#efcf9b" stroke="white" stroke-width="2"/>
  <line x1="737" y1="470" x2="823" y2="470" class="step"/>
  <line x1="837" y1="470" x2="923" y2="470" class="step"/>
  <line x1="937" y1="470" x2="1023" y2="470" class="step"/>
  <text x="721" y="458" class="small">1</text>
  <text x="816" y="458" class="small">5/4</text>
  <text x="916" y="458" class="small">3/2</text>
  <text x="1016" y="458" class="small">7/4</text>
  <text x="770" y="493" class="small" fill="#137c8b">+1/4</text>
  <text x="870" y="493" class="small" fill="#137c8b">+1/4</text>
  <text x="970" y="493" class="small" fill="#137c8b">+1/4</text>

  <!-- Bottom transformation chain -->
  <rect x="40" y="530" width="1120" height="325" rx="6" class="box"/>
  <text x="65" y="566" class="panel-title">3. 换原点的本质：选择一个能让公式变简单的参照中心</text>

  <rect x="75" y="610" width="285" height="165" rx="6" fill="#f8fbfc" stroke="#9cc5cb"/>
  <text x="217" y="642" text-anchor="middle" class="body">旧坐标：原点是 0</text>
  <text x="217" y="687" text-anchor="middle" class="math">aₙ₊₁ = (6aₙ−4)/(aₙ+2)</text>
  <text x="217" y="728" text-anchor="middle" class="small">特殊中心 2 藏在公式里</text>
  <text x="217" y="753" text-anchor="middle" class="small">前后项结构不一致</text>

  <path d="M370 690 L440 690" class="arrow"/>
  <text x="405" y="672" text-anchor="middle" class="small">原点移到 2</text>
  <text x="405" y="718" text-anchor="middle" class="math">uₙ=aₙ−2</text>

  <rect x="450" y="610" width="285" height="165" rx="6" fill="#fffaf3" stroke="#d9b36f"/>
  <text x="592" y="642" text-anchor="middle" class="body">新坐标：原点是 2</text>
  <text x="592" y="687" text-anchor="middle" class="math">uₙ₊₁ = 4uₙ/(uₙ+4)</text>
  <text x="592" y="728" text-anchor="middle" class="small">不动点已经移动到 0</text>
  <text x="592" y="753" text-anchor="middle" class="small">前后都出现同一种偏离量 u</text>

  <path d="M745 690 L815 690" class="arrow"/>
  <text x="780" y="672" text-anchor="middle" class="small">换一把尺子</text>
  <text x="780" y="718" text-anchor="middle" class="math">bₙ=1/uₙ</text>

  <rect x="825" y="610" width="300" height="165" rx="6" fill="#f7faf7" stroke="#8db093"/>
  <text x="975" y="642" text-anchor="middle" class="body">倒数坐标：等距刻度</text>
  <text x="975" y="687" text-anchor="middle" class="math">bₙ₊₁ = bₙ + 1/4</text>
  <text x="975" y="728" text-anchor="middle" class="small">复杂递推变成直线运动</text>
  <text x="975" y="753" text-anchor="middle" class="small">每走一步，坐标固定增加 1/4</text>

  <text x="600" y="824" text-anchor="middle" class="body">
    换原点没有改变数列，只是把“离不动点多远”变成新的坐标；再取倒数后，这种变化恰好成为等距离移动。
  </text>
</svg>
