<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角函数线多周期绘制动画（从-2π开始）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            padding: 10px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
        }
        
        h1 {
            color: #4cc9f0;
            margin-bottom: 5px;
            font-size: 1.8em;
        }
        
        .subtitle {
            color: #aaccff;
            font-size: 0.9em;
        }
        
        .main-canvas-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .combined-canvas {
            position: relative;
            height: 500px;
            background: #0f3460;
            border-radius: 8px;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .controls-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
        }
        
        h2 {
            color: #ff6b9d;
            margin-bottom: 15px;
            font-size: 1.2em;
            text-align: center;
        }
        
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        label {
            color: #72efdd;
            font-size: 0.9em;
            display: flex;
            justify-content: space-between;
        }
        
        .value-display {
            color: #ffcc00;
            font-weight: bold;
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #3a3a8a;
            border-radius: 3px;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            width: 16px;
            height: 16px;
            background: #4cc9f0;
            border-radius: 50%;
        }
        
        .buttons-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }
        
        button {
            padding: 12px;
            background: #4361ee;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
        }
        
        button:hover {
            background: #3a56d4;
            transform: translateY(-1px);
        }
        
        .info-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 0.9em;
        }
        
        .legend {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.8em;
            line-height: 1.4;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 3px 0;
        }
        
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
        
        .current-info {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9em;
        }
        
        .math-equation {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            color: #4cc9f0;
            font-size: 1em;
        }
        
        .cycle-marks {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85em;
        }
        
        .y-range-info {
            position: absolute;
            top: 60px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85em;
            color: #ff6666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>三角函数线多周期绘制动画（从-2π开始）</h1>
            <p class="subtitle">单位圆上的点如何生成完整的三角函数曲线 - 从-2π开始绘制</p>
        </header>
        
        <div class="main-canvas-container">
            <div class="combined-canvas">
                <canvas id="combinedCanvas"></canvas>
                
                <div class="math-equation" id="equation">y = sin(x), 范围: -2π 到 6π, y ∈ [-1, 1]</div>
                
                <div class="y-range-info">
                    y范围: <span id="yRange">[-1, 1]</span>
                </div>
                
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #4cc9f0;"></div>
                        <span>单位圆</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ff6b9d;"></div>
                        <span>角度θ</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #66bb6a;"></div>
                        <span>sinθ投影</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ffcc00;"></div>
                        <span>当前绘制点</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ff6666;"></div>
                        <span>Y范围虚线(y=±1)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ff9900;"></div>
                        <span>Y轴(向右平移2π)</span>
                    </div>
                </div>
                
                <div class="current-info">
                    <div>角度: <span id="currentAngle">-6.28</span> rad</div>
                    <div>sin(θ) = <span id="currentSin">0.00</span></div>
                    <div>y范围: <span id="yRangeDisplay">[-1, 1]</span></div>
                </div>
                
                <div class="cycle-marks">
                    已绘制: <span id="drawnPoints">0</span> 个点<br>
                    进度: <span id="drawProgress">0%</span>
                </div>
            </div>
        </div>
        
        <div class="controls-panel">
            <h2>动画控制面板</h2>
            
            <div class="controls-grid">
                <div class="control-group">
                    <label>
                        角度 θ:
                        <span class="value-display" id="angleValue">-6.28</span> rad
                    </label>
                    <input type="range" id="angleSlider" min="-6.28" max="18.84" step="0.01" value="-6.28">
                </div>
                
                <div class="control-group">
                    <label>
                        动画速度:
                        <span class="value-display" id="speedValue">1.0</span>x
                    </label>
                    <input type="range" id="speedSlider" min="0.1" max="5" step="0.1" value="1">
                </div>
                
                <div class="control-group">
                    <label>
                        函数类型:
                        <span class="value-display" id="funcValue">正弦(sin)</span>
                    </label>
                    <input type="range" id="funcSlider" min="0" max="2" step="1" value="0">
                </div>
                
                <div class="control-group">
                    <label>
                        周期数量:
                        <span class="value-display" id="cycleValue">4个周期</span>
                    </label>
                    <input type="range" id="cycleSlider" min="1" max="8" step="1" value="4">
                </div>
                
                <div class="control-group">
                    <label>
                        起始角度:
                        <span class="value-display" id="startValue">-2π</span>
                    </label>
                    <input type="range" id="startSlider" min="-4" max="0" step="1" value="-2">
                </div>
            </div>
            
            <div class="buttons-row">
                <button id="playBtn">▶️ 开始绘制</button>
                <button id="pauseBtn">⏸️ 暂停</button>
                <button id="restartBtn">🔄 重新开始</button>
                <button id="fastBtn">⚡ 快速绘制</button>
                <button id="fullBtn">📈 显示完整曲线</button>
            </div>
            
            <div class="info-bar">
                <div>起始角度: <span id="startAngle">-6.28</span> rad (-2π)</div>
                <div>结束角度: <span id="endAngle">18.84</span> rad (6π)</div>
                <div>总点数: <span id="totalPoints">1256</span> | 已绘制: <span id="drawnCount">0</span></div>
                <div>Y值范围: <span id="yRangeValue">[-1, 1]</span></div>
            </div>
        </div>
    </div>

    <script>
        // 获取画布
        const canvas = document.getElementById('combinedCanvas');
        const ctx = canvas.getContext('2d');
        
        // 动画状态
        let angle = -Math.PI * 2; // 从-2π开始
        let isAnimating = false;
        let animationId = null;
        let speed = 1.0;
        let funcType = 0; // 0: sin, 1: cos, 2: tan
        let totalCycles = 4; // 总周期数
        let startCycle = -2; // 起始周期偏移（以π为单位）
        let minAngle = -Math.PI * 2; // 最小角度 -2π
        let maxAngle = minAngle + Math.PI * 2 * totalCycles; // 最大角度
        let curvePoints = [];
        let isFastMode = false;
        
        // 初始化
        function init() {
            // 设置画布尺寸
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            
            // 更新角度范围
            minAngle = startCycle * Math.PI;
            maxAngle = minAngle + Math.PI * 2 * totalCycles;
            
            // 更新滑块
            document.getElementById('angleSlider').min = minAngle.toFixed(2);
            document.getElementById('angleSlider').max = maxAngle.toFixed(2);
            
            // 更新显示
            updateDisplays();
            draw();
        }
        
        // 计算函数值
        function calculateFunction(x) {
            switch(funcType) {
                case 0: return Math.sin(x);
                case 1: return Math.cos(x);
                case 2: return Math.tan(x);
                default: return Math.sin(x);
            }
        }
        
        // 获取函数名称
        function getFunctionName() {
            switch(funcType) {
                case 0: return '正弦(sin)';
                case 1: return '余弦(cos)';
                case 2: return '正切(tan)';
                default: return '正弦(sin)';
            }
        }
        
        // 获取函数符号
        function getFunctionSymbol() {
            switch(funcType) {
                case 0: return 'sin';
                case 1: return 'cos';
                case 2: return 'tan';
                default: return 'sin';
            }
        }
        
        // 获取Y值范围
        function getYRange() {
            switch(funcType) {
                case 0: return '[-1, 1]';  // sin: 值域[-1, 1]
                case 1: return '[-1, 1]';  // cos: 值域[-1, 1]
                case 2: return '(-∞, +∞)'; // tan: 值域为全体实数
                default: return '[-1, 1]';
            }
        }
        
        // 获取起始角度描述
        function getStartDescription() {
            if (startCycle === -4) return '-4π';
            if (startCycle === -3) return '-3π';
            if (startCycle === -2) return '-2π';
            if (startCycle === -1) return '-π';
            if (startCycle === 0) return '0';
            return `${startCycle}π`;
        }
        
        // 更新显示
        function updateDisplays() {
            // 角度显示
            document.getElementById('angleValue').textContent = angle.toFixed(2);
            document.getElementById('currentAngle').textContent = angle.toFixed(2);
            
            // 函数显示
            document.getElementById('funcValue').textContent = getFunctionName();
            const yRange = getYRange();
            const startDesc = getStartDescription();
            const endAngle = (startCycle + totalCycles * 2) * Math.PI;
            const endDesc = endAngle === 0 ? '0' : `${endAngle / Math.PI}π`;
            document.getElementById('equation').textContent = 
                `y = ${getFunctionSymbol()}(x), 范围: ${startDesc} 到 ${endDesc}, y ∈ ${yRange}`;
            
            // 范围显示
            document.getElementById('startAngle').textContent = minAngle.toFixed(2) + ` (${startDesc})`;
            document.getElementById('endAngle').textContent = maxAngle.toFixed(2) + ` (${endDesc})`;
            
            // Y范围显示
            document.getElementById('yRange').textContent = yRange;
            document.getElementById('yRangeDisplay').textContent = yRange;
            document.getElementById('yRangeValue').textContent = yRange;
            
            // 周期显示
            document.getElementById('cycleValue').textContent = `${totalCycles}个周期`;
            
            // 起始角度显示
            document.getElementById('startValue').textContent = getStartDescription();
            
            // 总角度和点数
            const totalAngle = maxAngle - minAngle;
            const totalPoints = Math.ceil(totalAngle * 50);
            document.getElementById('totalPoints').textContent = totalPoints;
            
            // 已绘制点数
            const drawnCount = curvePoints.length;
            const drawnProgress = Math.min(100, Math.max(0, (angle - minAngle) / (maxAngle - minAngle) * 100)).toFixed(1);
            document.getElementById('drawnCount').textContent = drawnCount;
            document.getElementById('drawnPoints').textContent = drawnCount;
            document.getElementById('drawProgress').textContent = drawnProgress + '%';
            
            // 当前函数值
            const funcValue = calculateFunction(angle);
            document.getElementById('currentSin').textContent = funcValue.toFixed(2);
        }
        
        // 绘制Y范围虚线
        function drawYRangeLines() {
            const width = canvas.width;
            const height = canvas.height;
            const centerY = height / 2;
            const amplitude = height * 0.25;
            
            // 计算0点的x坐标
            const pixelsPerRadian = (width - 300) / (maxAngle - minAngle);
            const zeroX = 300 + (-minAngle) * pixelsPerRadian; // x=0的位置
            
            // 绘制y=1的虚线
            const y1 = centerY - amplitude; // y=1的位置
            ctx.strokeStyle = '#ff6666';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 3]);
            
            ctx.beginPath();
            ctx.moveTo(300, y1);
            ctx.lineTo(width, y1);
            ctx.stroke();
            
            // 绘制y=-1的虚线
            const yMinus1 = centerY + amplitude; // y=-1的位置
            ctx.beginPath();
            ctx.moveTo(300, yMinus1);
            ctx.lineTo(width, yMinus1);
            ctx.stroke();
            
            ctx.setLineDash([]);
            
            // 标记y=1和y=-1
            ctx.fillStyle = '#ff6666';
            ctx.font = '12px Arial';
            ctx.textAlign = 'right';
            ctx.fillText('y = 1', zeroX - 10, y1 - 5);
            ctx.fillText('y = -1', zeroX - 10, yMinus1 + 15);
        }
        
        // 绘制Y轴
        function drawYAxis() {
            const width = canvas.width;
            const height = canvas.height;
            const centerY = height / 2;
            
            // 计算0点的x坐标
            const pixelsPerRadian = (width - 300) / (maxAngle - minAngle);
            const zeroX = 300 + (-minAngle) * pixelsPerRadian;
            
            // 绘制Y轴
            ctx.strokeStyle = '#ff9900';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(zeroX, 0);
            ctx.lineTo(zeroX, height);
            ctx.stroke();
            
            // 标记Y轴
            ctx.fillStyle = '#ff9900';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Y轴 (x=0)', zeroX, 20);
            
            // 绘制原点
            ctx.fillStyle = '#ff9900';
            ctx.beginPath();
            ctx.arc(zeroX, centerY, 4, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // 绘制网格和坐标轴
        function drawGrid() {
            const width = canvas.width;
            const height = canvas.height;
            const centerY = height / 2;
            
            // 绘制背景
            ctx.fillStyle = '#0f3460';
            ctx.fillRect(0, 0, width, height);
            
            // 绘制水平网格线
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            
            for (let y = 0; y <= height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            
            // 绘制垂直网格线
            const pixelsPerRadian = (width - 300) / (maxAngle - minAngle);
            for (let x = 300; x <= width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            
            // 绘制X轴
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(300, centerY);
            ctx.lineTo(width, centerY);
            ctx.stroke();
            
            // 绘制左侧边界线
            ctx.beginPath();
            ctx.moveTo(300, 0);
            ctx.lineTo(300, height);
            ctx.stroke();
        }
        
        // 绘制单位圆
        function drawUnitCircle() {
            const centerX = 150;
            const centerY = canvas.height / 2;
            const radius = 80;
            
            // 绘制单位圆
            ctx.strokeStyle = '#4cc9f0';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.stroke();
            
            // 绘制坐标轴
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 1;
            
            // X轴
            ctx.beginPath();
            ctx.moveTo(centerX - radius, centerY);
            ctx.lineTo(centerX + radius, centerY);
            ctx.stroke();
            
            // Y轴
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - radius);
            ctx.lineTo(centerX, centerY + radius);
            ctx.stroke();
            
            // 计算单位圆上的点（使用angle的模）
            const circleAngle = angle % (Math.PI * 2);
            const pointX = centerX + radius * Math.cos(circleAngle);
            const pointY = centerY - radius * Math.sin(circleAngle); // 注意：y轴向下
            
            // 绘制角度线
            ctx.strokeStyle = '#ff6b9d';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(pointX, pointY);
            ctx.stroke();
            
            // 绘制角度弧
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 0.3, 0, -circleAngle, true);
            ctx.stroke();
            
            // 绘制三角函数线（sin投影）
            if (funcType === 0 || funcType === 2) {
                ctx.strokeStyle = '#66bb6a';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(pointX, pointY);
                ctx.lineTo(pointX, centerY);
                ctx.stroke();
            }
            
            // 绘制当前点
            ctx.fillStyle = '#ff6b9d';
            ctx.beginPath();
            ctx.arc(pointX, pointY, 6, 0, Math.PI * 2);
            ctx.fill();
            
            // 标记角度
            ctx.fillStyle = '#ff6b9d';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`θ = ${circleAngle.toFixed(2)} rad`, centerX, centerY - 100);
        }
        
        // 绘制曲线
        function drawCurve() {
            const width = canvas.width;
            const height = canvas.height;
            const centerY = height / 2;
            const amplitude = height * 0.25;
            const pixelsPerRadian = (width - 300) / (maxAngle - minAngle);
            
            // 绘制已生成的曲线
            if (curvePoints.length > 1) {
                ctx.strokeStyle = '#66bb6a';
                ctx.lineWidth = 3;
                ctx.beginPath();
                
                for (let i = 0; i < curvePoints.length; i++) {
                    const point = curvePoints[i];
                    const x = 300 + (point.x - minAngle) * pixelsPerRadian;
                    const y = centerY - point.y * amplitude;
                    
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.stroke();
            }
            
            // 绘制当前点
            if (angle >= minAngle && angle <= maxAngle) {
                const funcValue = calculateFunction(angle);
                const currentX = 300 + (angle - minAngle) * pixelsPerRadian;
                const currentY = centerY - funcValue * amplitude;
                
                // 绘制当前点
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.arc(currentX, currentY, 8, 0, Math.PI * 2);
                ctx.fill();
                
                // 绘制连接线
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                ctx.moveTo(currentX, currentY);
                ctx.lineTo(currentX, centerY);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }
        
        // 绘制刻度标记
        function drawScaleMarks() {
            const width = canvas.width;
            const height = canvas.height;
            const centerY = height / 2;
            const pixelsPerRadian = (width - 300) / (maxAngle - minAngle);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            
            // 绘制π的倍数刻度
            for (let i = Math.floor(minAngle / Math.PI) * Math.PI; i <= maxAngle; i += Math.PI) {
                const x = 300 + (i - minAngle) * pixelsPerRadian;
                
                // 绘制刻度线
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, centerY - 5);
                ctx.lineTo(x, centerY + 5);
                ctx.stroke();
                
                // 标记刻度值
                let label = '';
                if (i === 0) label = '0';
                else if (i === Math.PI) label = 'π';
                else if (i === -Math.PI) label = '-π';
                else if (i === Math.PI * 2) label = '2π';
                else if (i === -Math.PI * 2) label = '-2π';
                else if (i === Math.PI * 3) label = '3π';
                else if (i === Math.PI * 4) label = '4π';
                else if (i === Math.PI * 5) label = '5π';
                else if (i === Math.PI * 6) label = '6π';
                else label = `${i / Math.PI}π`;
                
                ctx.fillText(label, x, centerY + 10);
            }
        }
        
        // 绘制所有
        function draw() {
            drawGrid();
            drawYRangeLines();
            drawYAxis();
            drawUnitCircle();
            drawCurve();
            drawScaleMarks();
        }
        
        // 动画函数
        function animate() {
            if (isAnimating) {
                // 计算角度增量
                let increment = 0.02 * speed;
                if (isFastMode) increment = 0.1 * speed;
                
                angle += increment;
                
                // 添加点到曲线
                if (angle >= minAngle && angle <= maxAngle) {
                    // 确保不重复添加点
                    if (curvePoints.length === 0 || angle > curvePoints[curvePoints.length - 1].x + 0.05) {
                        const yValue = calculateFunction(angle);
                        curvePoints.push({x: angle, y: yValue});
                    }
                }
                
                // 如果到达最大角度，停止动画
                if (angle >= maxAngle) {
                    isAnimating = false;
                    document.getElementById('playBtn').textContent = '▶️ 重新开始';
                }
                
                // 更新滑块
                document.getElementById('angleSlider').value = angle;
                
                // 更新显示并绘制
                updateDisplays();
                draw();
            }
            animationId = requestAnimationFrame(animate);
        }
        
        // 事件监听
        document.getElementById('angleSlider').addEventListener('input', function() {
            angle = parseFloat(this.value);
            curvePoints = [];
            
            // 重新生成曲线点
            for (let a = minAngle; a <= angle; a += 0.05) {
                const yValue = calculateFunction(a);
                curvePoints.push({x: a, y: yValue});
            }
            
            updateDisplays();
            draw();
        });
        
        document.getElementById('speedSlider').addEventListener('input', function() {
            speed = parseFloat(this.value);
            document.getElementById('speedValue').textContent = speed.toFixed(1);
        });
        
        document.getElementById('funcSlider').addEventListener('input', function() {
            funcType = parseInt(this.value);
            curvePoints = [];
            angle = minAngle;
            document.getElementById('angleSlider').value = minAngle;
            updateDisplays();
            draw();
        });
        
        document.getElementById('cycleSlider').addEventListener('input', function() {
            totalCycles = parseInt(this.value);
            maxAngle = minAngle + Math.PI * 2 * totalCycles;
            document.getElementById('angleSlider').max = maxAngle.toFixed(2);
            
            // 调整当前角度
            if (angle > maxAngle) {
                angle = maxAngle;
                document.getElementById('angleSlider').value = maxAngle;
            }
            
            curvePoints = [];
            updateDisplays();
            draw();
        });
        
        document.getElementById('startSlider').addEventListener('input', function() {
            startCycle = parseInt(this.value);
            const oldMinAngle = minAngle;
            minAngle = startCycle * Math.PI;
            
            // 调整当前角度
            angle = angle - oldMinAngle + minAngle;
            maxAngle = minAngle + Math.PI * 2 * totalCycles;
            
            // 更新滑块
            document.getElementById('angleSlider').min = minAngle.toFixed(2);
            document.getElementById('angleSlider').max = maxAngle.toFixed(2);
            document.getElementById('angleSlider').value = angle;
            
            curvePoints = [];
            updateDisplays();
            draw();
        });
        
        document.getElementById('playBtn').addEventListener('click', function() {
            if (angle >= maxAngle) {
                // 重新开始
                angle = minAngle;
                curvePoints = [];
                document.getElementById('angleSlider').value = minAngle;
            }
            
            isAnimating = true;
            isFastMode = false;
            this.textContent = '⏸️ 暂停';
            if (!animationId) {
                animate();
            }
        });
        
        document.getElementById('pauseBtn').addEventListener('click', function() {
            isAnimating = false;
            document.getElementById('playBtn').textContent = '▶️ 继续';
        });
        
        document.getElementById('restartBtn').addEventListener('click', function() {
            angle = minAngle;
            curvePoints = [];
            document.getElementById('angleSlider').value = minAngle;
            isAnimating = false;
            updateDisplays();
            draw();
            document.getElementById('playBtn').textContent = '▶️ 开始绘制';
        });
        
        document.getElementById('fastBtn').addEventListener('click', function() {
            isFastMode = !isFastMode;
            this.textContent = isFastMode ? '🐌 普通速度' : '⚡ 快速绘制';
        });
        
        document.getElementById('fullBtn').addEventListener('click', function() {
            angle = maxAngle;
            curvePoints = [];
            
            // 生成完整曲线
            for (let a = minAngle; a <= maxAngle; a += 0.05) {
                const yValue = calculateFunction(a);
                curvePoints.push({x: a, y: yValue});
            }
            
            document.getElementById('angleSlider').value = maxAngle;
            isAnimating = false;
            updateDisplays();
            draw();
            document.getElementById('playBtn').textContent = '▶️ 重新开始';
        });
        
        // 初始化和窗口调整
        window.addEventListener('load', init);
        window.addEventListener('resize', init);
        
        // 开始绘制
        init();
    </script>
</body>
</html>
